# Local test topology. Mirrors the Railway deployment: one public service, one volume.
name: tracktor-railway-test

services:
  tracktor:
    # Built from this repository. CI and the Railway template use the published GHCR image instead.
    build:
      context: .
      args:
        WRAPPER_VERSION: ${WRAPPER_VERSION:-0.0.0-local}
        VCS_REF: ${VCS_REF:-local}
    image: ${TRACKTOR_RAILWAY_IMAGE:-tracktor-railway:local}
    restart: unless-stopped
    environment:
      PORT: '8080'
      TRACKTOR_OWNER_USERNAME: owner
      TRACKTOR_OWNER_PASSWORD: local-test-only-tracktor-password
      APP_SECRET: local-test-only-app-secret-not-for-production
      CORS_ORIGINS: http://127.0.0.1:8080
      HTTP_MODE: http
      TZ: UTC
    volumes:
      - trk:/data
    ports:
      - '127.0.0.1:${TRACKTOR_TEST_PORT:-8080}:8080'

volumes:
  trk:
